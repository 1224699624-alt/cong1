# V3 协议模板：路径/真实验证状态必须由本地证据补齐。
# 空模板的静态检查成功不等于可以开始训练。
schema_version: '3.0'
status: DRAFT_NOT_EXECUTED
method_line: input_seam__nnunet__output_overlap__unified_coordination
scope:
  datasets: [TSRS, RAM]
  backbone: nnunet
  cross_backbone_enabled: false
  test_enabled: false
  reconstruct_native_from_scratch: false
  mandatory_oof: false
  replace_overlap_with_completion: false
  same_image_can_have_both_structures: true
source_lock:
  audit_commit: 737cc4f3a1c395f1ae6fe842c4a2e51d6cf98353
  actual_repo_commit: null
  dirty_diff_sha256: null
  task_sha256: null
run:
  default_stage: preflight
  pilot_enabled: false
  formal_enabled: false
  output_root: outputs/dual_prior_v3
  overwrite_existing: false
  auto_long_training: false
  hardware_verified: false
  protocol_locked: false
  paired_seeds: [3512]       # 继承作候选 pilot seed；不是已运行
  pilot_epochs: 2           # 有界探索默认；实际update预算另行锁定
  formal_seeds: null
  mode: joint_finetune
contracts:
  clean_ablation: true
  input_adapter_reads_overlap: false
  output_overlap_has_independent_channel: true
  overlap_generator_input: image_only
  allow_legacy_coupled_context_in_main_table: false
  zero_init_input: true
  zero_init_output: true
  bounded_input_residual: true
  bounded_output_residual: true
  input_residual_limit: null
  output_residual_limit: null
  numerical_identity_tolerance: null
  no_gt_in_inference: true
  native_output_semantics_preserved: true
  target_and_weight_separate: true
  unknown_overlap_is_negative: false
  prior_probabilities_forced_disjoint: false
  valid_masks_required: true
  current_student_selects_weak_roi: false
prior_adaptation:
  # 仅在原先验的seam依赖阻碍clean C时使用；不训练新分割骨架。
  enabled: false
  dataset: RAM
  mode: existing_small_overlap_prior_to_image_only
  epochs_limit: 6           # 沿用历史量级作为拟定上限，不是已执行
  selection: lowest_validation_bce
  no_test: true
  budget_locked: false
loss:
  base_loss_same_within_dataset: true
  base_loss_resolved: false
  native_deep_supervision_preserved: true
  observed_overlap: known_membership_only
  weak_overlap: observed_union_under_frozen_overlap_evidence
  weak_overlap_is_true_gt: false
  teacher: common_frozen_native
  lambda_seam: null
  lambda_overlap: null
  lambda_preserve: null
  beta_weak: null
  mass_weighting: valid_and_observation_aware
  mass_parameters_locked: false
  routing:
    enabled: true
    none_coordinates_as_zero: true
    per_aux_cap: null
    aggregate_cap: null
    empty_or_zero_base_policy: skip_aux_when_base_near_zero
    log_pairwise_and_aggregate_conflicts: true
arms:
  A: {label: Native_Continue, input_seam: false, output_overlap: false, routing: false}
  B: {label: Seam_Only, input_seam: true, output_overlap: false, routing: true}
  C: {label: Overlap_Only, input_seam: false, output_overlap: true, routing: true}
  D: {label: Dual_Unified, input_seam: true, output_overlap: true, routing: true}
  D_no_routing: {label: Dual_No_Routing, input_seam: true, output_overlap: true, routing: false}
# N0是已有权重的固定推理参考，不是需要从头训练的第六个arm。
quality_gate:
  overall_metrics: [dice_or_dsc, iou]
  reference_comparisons: [N0, A]
  causal_reference: A
  historical_native_reference: N0
  absolute_noninferiority_margin: 0.0
  margin_status: inherited_strict_point_estimate_not_statistical_guarantee
  exploratory_structure_relative_reduction: 0.05
  structure_threshold_origin: R351_exploratory_default_not_user_fixed_threshold
  undefined_metric_is_pass: false
  distance_failure_rate_must_not_increase: true
  single_checkpoint_all_metrics: true
  same_case_cohort: true
  no_posthoc_evaluator_changes: true
  selection_rule_locked: false
  claim_requires_paired_statistics: true
  test_history_status: NOT_AUDITED
